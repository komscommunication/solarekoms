services:
  postgres:
    image: postgres:16
    container_name: solarcops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solarcops_db
    ports:
      - "5432:5432"
    volumes:
      - solarcops_postgres_data:/var/lib/postgresql/data

volumes:
  solarcops_postgres_data:
